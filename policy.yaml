# Base sandbox policy for the Orca server sandbox.
#
# Passed via ORCA_SERVER_POLICY at `server.sh up` (sandbox create --policy).
# It OVERRIDES the built-in default policy, so the default filesystem rules
# are replicated below — do not drop them. Credential-provider network rules
# (ORCA_SERVER_PROVIDERS) compose on top of this base and are not needed here.
#
# Why this file exists: the OpenShell network policy gates egress per binary.
# The bundled Orca node (/usr/local/orca-server/runtimes/node-*/bin/node) is
# not covered by the provider rules (which list codex, git, gh, curl, ...),
# so Orca's own traffic is denied unless listed here. Without the
# api.openai.com rule, Orca's Codex model-catalog/auth probe fails
# (ECONNRESET/EACCES in orcad.trace.ndjson) and the desktop reports
# "Codex unconfigured" even though the provider-injected OPENAI_API_KEY is
# present and valid. Without the github.com rule, clones/pushes from Orca
# agents fail. The node path uses a glob so it survives ORCA_VERSION bumps
# (the directory name is a per-release hash).
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /bin
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /var/log
  read_write:
    - /tmp
    - /dev/null
landlock:
  compatibility: best_effort
network_policies:
  orca_node_openai:
    name: orca_node_openai
    endpoints:
      - host: api.openai.com
        port: 443
        protocol: rest
        access: read-write
    binaries:
      - path: /usr/local/orca-server/runtimes/node-*/bin/node
  orca_node_github:
    name: orca_node_github
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: "**"
          - allow:
              method: HEAD
              path: "**"
          - allow:
              method: OPTIONS
              path: "**"
          - allow:
              method: POST
              path: /**/git-upload-pack
    binaries:
      - path: /usr/local/orca-server/runtimes/node-*/bin/node
